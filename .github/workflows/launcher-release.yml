name: Release launcher

# Publishes the Windows launcher as a self-contained single file release asset.
# The client manifest of the MuMain repository points to the assets of this release,
# see docs/ClientLauncherDesign.md.

on:
  push:
    tags:
      - 'launcher-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish the launcher
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish the launcher
        run: >
          dotnet publish src/ClientLauncher/MUnique.OpenMU.ClientLauncher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:ci=true
          --output out/launcher

      - name: Prepare the release assets
        shell: pwsh
        run: |
          Move-Item out/launcher/MUnique.OpenMU.ClientLauncher.exe out/MuMainLauncher.exe
          $hash = (Get-FileHash out/MuMainLauncher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MuMainLauncher.exe" | Set-Content -NoNewline out/MuMainLauncher.exe.sha256

          # The launcher compares this version with the one of the client manifest, so the
          # release tag has to use the version of the assembly (see src/SharedAssemblyInfo.cs).
          $exePath = (Resolve-Path out/MuMainLauncher.exe).Path
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exePath).FileVersion
          if (-not $version) {
            $version = [System.Reflection.AssemblyName]::GetAssemblyName($exePath).Version.ToString()
          }

          $size = (Get-Item out/MuMainLauncher.exe).Length
          Write-Host ("Launcher version {0}, {1:N1} MiB" -f $version, ($size / 1MB))
          "launcherVersion=$version" >> $env:GITHUB_OUTPUT
        id: assets

      - name: Determine the tag
        id: tag
        shell: pwsh
        run: |
          $version = '${{ steps.assets.outputs.launcherVersion }}'
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=launcher-v$version" >> $env:GITHUB_OUTPUT

          if ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref_name }}' -ne "launcher-v$version") {
            Write-Warning ("The pushed tag {0} does not match the assembly version {1}; the release is published as launcher-v{1}." -f '${{ github.ref_name }}', '$version')
          }

      - name: Create or update the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Launcher ${{ steps.tag.outputs.version }}" \
              --notes "Windows launcher which installs and updates the MuMain client automatically. See docs/ClientLauncherDesign.md." \
              --latest=false
          fi

          gh release upload "$tag" out/MuMainLauncher.exe out/MuMainLauncher.exe.sha256 --clobber
